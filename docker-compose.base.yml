services:
    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        ports:
            - "3000:3000"
        environment:
            GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
        volumes:
            - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
            - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards

    nginx:
        image: nginx:1.23.3
        container_name: nginx
        ports:
            - "80:80"
        volumes:
            - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:80/ping/" ]
            interval: 4s

    code:
        restart: on-failure
        build: .
        env_file:
            - "./deploy/.env.example"

    api:
        container_name: api
        command: [ "auth-service-api", "run", "api" ]
        expose:
            - 5000
        extends:
            service: code
        volumes:
            - "./src/app/adapters/db/alembic/migrations/versions/:/home/app/src/crudik/adapters/db/alembic/migrations/versions/"

    db:
        container_name: persistence
        image: postgres:14.1-alpine
        env_file:
            - ./deploy/.env.pg
        ports:
            - 5432:5432
        volumes:
          - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres" ]
            interval: 2s
